name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_password
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Prepare test database
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://atlas_user:atlas_password@localhost:5432/atlas_test?schema=public
        run: npx prisma db push

      - name: Run integration tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://atlas_user:atlas_password@localhost:5432/atlas_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_ci_secret_key
          PORT: 3000
        run: npm test

      - name: Run concurrency tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://atlas_user:atlas_password@localhost:5432/atlas_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_ci_secret_key
        run: npm run test:concurrency

      - name: Verify Docker Compose Build
        working-directory: ./server
        run: docker-compose build
