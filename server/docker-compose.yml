version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_password
      POSTGRES_DB: atlas_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: "postgresql://atlas:atlas_password@postgres:5432/atlas_db"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pgbouncer

  atlas-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "4001:4000"
    environment:
      - DATABASE_URL=postgresql://atlas:atlas_password@postgres:5432/atlas_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_dev_key_that_is_long_enough
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  atlas-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      - DATABASE_URL=postgresql://atlas:atlas_password@postgres:5432/atlas_db?schema=public
      - REDIS_URL=redis://redis:6379
      - SCHEDULER_INTERVAL_MS=5000
      - JWT_SECRET=super_secret_dev_key_that_is_long_enough
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  atlas-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://atlas:atlas_password@postgres:5432/atlas_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_dev_key_that_is_long_enough
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  atlas-frontend:
    image: node:20-alpine
    # Placeholder: frontend code not present yet.
    # When available, you can add build context like:
    # build:
    #   context: ../client
    working_dir: /app
    command: sh -c "echo 'Frontend not yet implemented' && sleep infinity"
    ports:
      - "3000:3000"
    depends_on:
      - atlas-api
